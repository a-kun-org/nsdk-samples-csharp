name: Runner Probe
on:
  push:
    branches: [ci/runner-probe]
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5
    steps:
      - name: Show runner info
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME on $env:COMPUTERNAME"
          Get-ChildItem 'C:\Program Files\Unity\Hub\Editor' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
